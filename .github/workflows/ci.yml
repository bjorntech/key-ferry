name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Bun ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun typecheck

      - name: Check formatting
        run: bun run format:check

      - name: Test with coverage
        run: mkdir -p coverage; set -o pipefail; bun run test:coverage 2>&1 | tee coverage/coverage.txt

      - name: Test CRAP quality gate
        run: set -o pipefail; CRAP_JSON=1 bun run test:crap 2>&1 | tee coverage/crap.json

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: warn

      - name: Build
        run: bun run build

      - name: Package dry run
        run: bun pm pack --dry-run
