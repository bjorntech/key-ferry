name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Bun ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun typecheck

      - name: Check formatting
        run: bun run format:check

      - name: Test with coverage
        run: mkdir -p coverage; set -o pipefail; bun run test:coverage 2>&1 | tee coverage/coverage.txt

      - name: Test CRAP quality gate
        run: set -o pipefail; CRAP_JSON=1 bun run test:crap 2>&1 | tee coverage/crap.json

      - name: Stress process lifecycle tests
        run: bun test tests/process.test.ts --rerun-each 5

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: warn

      - name: Build
        run: bun run build

      - name: Package dry run
        run: bun pm pack --dry-run

      - name: Smoke test npm 12 verified publish dry run
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/empty-npmrc
        run: |
          set -euo pipefail
          : > "$NPM_CONFIG_USERCONFIG"
          unset NPM_TOKEN NODE_AUTH_TOKEN
          release_dir="$RUNNER_TEMP/key-ferry-release"
          mkdir -p "$release_dir"
          npm pack --ignore-scripts --pack-destination "$release_dir"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          const directory = process.env.RUNNER_TEMP + "/key-ferry-release";
          const pkg = JSON.parse(await readFile("package.json", "utf8"));
          const filename = `${pkg.name.slice(1).replaceAll("/", "-")}-${pkg.version}.tgz`;
          const bytes = await readFile(join(directory, filename));
          await writeFile(join(directory, "manifest.json"), JSON.stringify({
            name: pkg.name, version: pkg.version, tag: `v${pkg.version}`, commit: "0".repeat(40), filename,
            sha256: createHash("sha256").update(bytes).digest("hex"),
          }));
          NODE
          npm install --global npm@12.2.0
          real_npm="$(command -v npm)"
          capture_dir="$RUNNER_TEMP/key-ferry-npm-capture"
          mkdir -p "$capture_dir"
          cat > "$capture_dir/npm" <<'SH'
          #!/usr/bin/env sh
          set -eu
          : "${CAPTURE_FILE:?CAPTURE_FILE is required}"
          printf '%s\n' "$@" > "$CAPTURE_FILE"
          SH
          chmod +x "$capture_dir/npm"
          PATH="$capture_dir:$PATH" CAPTURE_FILE="$capture_dir/argv" \
            node scripts/release/publish-verified.mjs --manifest "$release_dir/manifest.json" --publish
          registry_port_file="$RUNNER_TEMP/npm-registry-port"
          REGISTRY_PORT_FILE="$registry_port_file" node --input-type=module <<'NODE' &
          import { writeFile } from "node:fs/promises";
          import { createServer } from "node:http";
          const server = createServer((_request, response) => response.writeHead(404).end());
          server.listen(0, "127.0.0.1", async () => {
            await writeFile(process.env.REGISTRY_PORT_FILE, String(server.address().port));
          });
          NODE
          registry_pid=$!
          trap 'kill "$registry_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do test -s "$registry_port_file" && break; sleep 0.1; done
          test -s "$registry_port_file"
          registry_port="$(cat "$registry_port_file")"
          REAL_NPM="$real_npm" CAPTURE_FILE="$capture_dir/argv" REGISTRY_PORT="$registry_port" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { spawnSync } from "node:child_process";
          const args = (await readFile(process.env.CAPTURE_FILE, "utf8")).trimEnd().split("\n");
          if (args[0] !== "publish" || args.includes("--publish")) throw new Error(`invalid captured npm argv: ${JSON.stringify(args)}`);
          if (!args[1].endsWith(".tgz") || !args[1].startsWith("/")) throw new Error("captured artifact path is not absolute");
          if (!args.includes("--registry=https://registry.npmjs.org")) throw new Error("captured registry is not production npm");
          // npm 12 checks the live registry even for publish --dry-run. Use a
          // local 404 registry for the replay so this remains valid after the
          // current version has already been published.
          const replay = spawnSync(process.env.REAL_NPM, [...args, "--dry-run", `--registry=http://127.0.0.1:${process.env.REGISTRY_PORT}`], { stdio: "inherit" });
          if (replay.status !== 0) process.exit(replay.status ?? 1);
          NODE
          bad_args=(publish "$(sed -n '2p' "$capture_dir/argv")" --access public --registry=https://registry.npmjs.org --provenance --ignore-scripts --publish --dry-run)
          if "$real_npm" "${bad_args[@]}" >"$RUNNER_TEMP/bad-npm-argv.out" 2>&1; then
            echo 'npm unexpectedly accepted the obsolete internal --publish flag' >&2
            exit 1
          fi
          grep -E 'EUNKNOWNCONFIG|unknown option|Unknown option' "$RUNNER_TEMP/bad-npm-argv.out"
