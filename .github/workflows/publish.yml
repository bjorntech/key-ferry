name: Publish package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Check out the selected tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Validate release ref and package
        env:
          RELEASE_REF: ${{ github.ref }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_VISIBILITY" != public ]]; then
            echo "Publishing is disabled: the GitHub repository must be public for npm provenance." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release ref must be a stable vX.Y.Z tag; got $RELEASE_REF" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const pkg = JSON.parse(await readFile("package.json", "utf8"));
          const tag = process.env.RELEASE_REF.slice("refs/tags/".length);
          if (pkg.name !== "@bjorntech/key-ferry" || pkg.publishConfig?.access !== "public") {
            throw new Error("package name or public publish configuration is incorrect");
          }
          if (`v${pkg.version}` !== tag) {
            throw new Error(`tag ${tag} does not match package version ${pkg.version}`);
          }
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gate
        run: bun run quality

      - name: Build package
        run: bun run build

      - name: Create exact release tarball
        run: |
          set -euo pipefail
          rm -rf release
          mkdir release
          # The quality gate and build already ran; ignore lifecycle scripts while packing
          # so the authenticated publish job cannot execute package code.
          npm pack --ignore-scripts --pack-destination release
          node scripts/release/create-manifest.mjs
          cat release/manifest.json

      - name: Select artifact name
        id: artifact-name
        run: echo "name=release-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.run_id }}
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the same tag for provenance metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0

      - name: Install npm 12
        run: npm install --global npm@12.2.0

      - name: Download verified release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: release

      - name: Verify release artifact
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_VISIBILITY" != public ]]; then
            echo "Publishing is disabled: the GitHub repository must be public for npm provenance." >&2
            exit 1
          fi
          unset NPM_TOKEN NODE_AUTH_TOKEN
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, readdir } from "node:fs/promises";
          import { basename, resolve } from "node:path";
          const manifest = JSON.parse(await readFile("release/manifest.json", "utf8"));
          const pkg = JSON.parse(await readFile("package.json", "utf8"));
          const tag = process.env.RELEASE_REF.replace("refs/tags/", "");
          const files = (await readdir("release")).filter((file) => file.endsWith(".tgz"));
          const expected = `${pkg.name.slice(1).replaceAll("/", "-")}-${pkg.version}.tgz`;
          if (Object.keys(manifest).sort().join(",") !== "commit,filename,name,sha256,tag,version") throw new Error("invalid release manifest fields");
          if (manifest.name !== pkg.name || manifest.name !== "@bjorntech/key-ferry" || manifest.version !== pkg.version || manifest.tag !== tag || manifest.commit !== process.env.RELEASE_SHA || manifest.filename !== expected || files.length !== 1 || files[0] !== expected) throw new Error("release artifact metadata does not match this tag and commit");
          if (!/^[A-Za-z0-9._-]+\.tgz$/.test(manifest.filename) || resolve("release", manifest.filename) !== resolve("release", basename(manifest.filename))) throw new Error("unsafe tarball filename");
          const digest = createHash("sha256").update(await readFile(resolve("release", manifest.filename))).digest("hex");
          if (digest !== manifest.sha256) throw new Error("release tarball checksum mismatch");
          NODE

      - name: Reject an already published version
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("./release/manifest.json")).version')"
          probe_error="$(mktemp)"
          if versions="$(npm view @bjorntech/key-ferry versions --json 2>"$probe_error")"; then
            if node -e 'const versions = JSON.parse(process.argv[1]); process.exit((Array.isArray(versions) ? versions : [versions]).includes(process.argv[2]) ? 0 : 1)' "$versions" "$version"; then
              echo "@bjorntech/key-ferry@$version is already published; refusing to republish it." >&2
              exit 1
            fi
          elif grep -Eq 'E404|404 Not Found' "$probe_error"; then
            echo "@bjorntech/key-ferry is not on npm yet; the first publish must be completed manually after configuring the trusted publisher." >&2
          else
            cat "$probe_error" >&2
            exit 1
          fi
          rm -f "$probe_error"

      - name: Publish exact verified tarball with provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          unset NPM_TOKEN NODE_AUTH_TOKEN
          npm publish "release/$(node -p 'JSON.parse(require("./release/manifest.json")).filename')" --access public --provenance --ignore-scripts
